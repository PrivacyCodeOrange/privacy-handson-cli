[package]
name = "privacy_hands_on"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "handson"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
minreq = { version = "3.0.0", features = ["https", "json-using-serde", "urlencoding"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
urlencoding = "2.1.3"
